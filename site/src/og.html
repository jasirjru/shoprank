<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Newsreader:wght@500&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 627px; overflow: hidden; }
  body { background: #fbf8f1; background-image: linear-gradient(to bottom, transparent 43px, #e4ddcc 43px); background-size: 100% 44px;
         font-family: "Newsreader", Georgia, serif; color: #1d1b16; position: relative; }
  body::before { content: ""; position: absolute; top: 0; bottom: 0; left: 64px; width: 2px; background: #e8b4ad; }
  .wrap { position: absolute; left: 112px; right: 80px; top: 70px; }
  .brand { font-size: 34px; font-weight: 500; letter-spacing: -0.01em; }
  h1 { font-size: 64px; line-height: 1.08; font-weight: 500; letter-spacing: -0.025em; margin: 26px 0 34px; max-width: 980px; }
  .score { display: flex; align-items: baseline; gap: 48px; }
  .pair { display: flex; align-items: baseline; gap: 14px; }
  .num { font-family: "IBM Plex Mono", monospace; font-weight: 500; letter-spacing: -0.04em; }
  .ours { font-size: 72px; color: #b3261e; padding: 6px 22px; border-radius: 50%; box-shadow: inset 0 0 0 4px #b3261e; }
  .base { font-size: 52px; color: #5d5952; }
  .label { font-size: 28px; color: #3d3a33; }
  .foot { position: absolute; left: 112px; bottom: 44px; font-size: 24px; color: #5d5952; }
</style></head>
<body><div class="wrap">
  <div class="brand">ShopRank</div>
  <h1>Puts the right product first in 3 of 4 shop searches</h1>
  <div class="score"><span class="pair"><span class="num ours">75%</span><span class="label">ShopRank</span></span>
  <span class="pair"><span class="num base">63%</span><span class="label">keyword search</span></span></div>
</div>
<div class="foot">Amazon's public shopping-search benchmark · 8,956 searches · 32 MB model on a laptop CPU</div>
</body></html>
