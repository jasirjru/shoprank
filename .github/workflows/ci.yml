# Lint + unit tests, and a security job, on pushes to main and on pull requests. The tests use tiny fakes:
# no data, no GPU. torch comes from the CUDA 12.6 index (pyproject.toml); the wheel works on a CPU-only runner.
# `--locked` fails if uv.lock is out of date.
# Actions are pinned to full commit SHAs (a moved tag cannot change what runs); scanner binaries are checked
# against the SHA-256 published with their release. Versions chosen at least two weeks after release.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run --frozen ruff check src tests
      - run: uv run --frozen pytest -q

  docker:
    # Serving smoke test: build the CPU image (downloads the v1.0 model, checks SHA-256), start it, rank the
    # README example and assert the right product comes first.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: docker build -t shoprank:ci .
      - run: docker run -d --name shoprank -p 8000:8000 shoprank:ci
      - name: Wait for /health, then rank an example
        run: |
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf -X POST localhost:8000/rank -H "Content-Type: application/json" \
            -d '{"query": "usb c cable 6ft", "products": [{"product_id": "b", "title": "HDMI cable 10 ft"},
                 {"product_id": "a", "title": "Anker USB C to USB C cable, 6 ft", "brand": "Anker"}]}' | tee out.json
          python3 -c "import json; r = json.load(open('out.json'))['results']; assert r[0]['product_id'] == 'a', r"
          docker image ls shoprank:ci --format 'image size {{.Size}}'
      - if: failure()
        run: docker logs shoprank

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans the whole history
      - name: Known vulnerabilities in locked dependencies (osv-scanner 2.7.0)
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile=uv.lock
      - name: Secrets in git history (gitleaks 8.30.1)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .
