[project]
name = "shoprank"
version = "1.1.1"
description = "Learned product search ranking on the Amazon ESCI dataset"
authors = [
    { name = "Jasir Abdul Hameed", email = "144598391+jasirjru@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "accelerate>=1.16",
    "datasets>=5.2",
    "duckdb>=2.0.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "onnx>=1.23.2",
    "onnxruntime>=1.32.0",
    "pandas>=3.1.1",
    "protobuf>=7.36.2",
    "pyarrow>=26.0.1",
    "pytrec-eval-terrier>=0.5.11",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3",
    "sentencepiece>=0.2.3",
    "torch>=2.13.0,<2.14",
    "transformers>=5.23",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
demo = [
    "gradio>=6.32.0",
]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "scikit-learn>=1.9.1",
]

# PyTorch with CUDA 12.6 (RTX 4060). Only torch comes from this index. The cu128 index stops at torch 2.11,
# which has GHSA-rrmf-rvhw-rf47 and caps setuptools < 82; 2.13 (the fix) is built for cu126 and cu130+.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
